events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=predict_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=explain_limit:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_x_request_id" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;

        client_max_body_size 1m;

        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        # Block external metrics access
        location = /metrics {
            deny all;
            return 403;
        }

        # Rate limited predict — exact and prefix match
        location = /api/predict {
            limit_req zone=predict_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://backend:8000/predict;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Rate limited explain
        location = /api/explain {
            limit_req zone=explain_limit burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://backend:8000/explain;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # General backend API — no rate limiting
        location /api/ {
            limit_req zone=general_limit burst=10 nodelay;
            limit_req_status 429;

            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Frontend
        location / {
            proxy_pass http://frontend:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}