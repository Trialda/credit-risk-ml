apiVersion: 1

groups:
  - orgId: 1
    name: drift_alerts
    folder: Credit Risk Alerts
    interval: 1m
    rules:
      - uid: significant_drift_alert
        title: Significant drift detected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(credit_risk_feature_psi)
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "__expr__"
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.2]
        noDataState: NoData
        execErrState: Error
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "At least one feature shows PSI above 0.2 — significant drift detected."